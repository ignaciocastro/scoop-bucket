name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests
        uses: scoopinstaller/github-actions@master
        env:
          ACTION: check_manifest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
