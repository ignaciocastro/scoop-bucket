name: Excavator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  excavate:
    name: Excavator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Excavate
        uses: scoopinstaller/excavator@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
